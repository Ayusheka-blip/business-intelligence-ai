<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<title>Business Proposal</title>
<style>
  @page {
    size: A4;
    margin: 20mm 15mm 20mm 15mm;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1e293b;
    line-height: 1.6;
    font-size: 11pt;
  }
  h1 { font-size: 22pt; color: #0f172a; border-bottom: 2px solid #6366f1; padding-bottom: 6px; margin-top: 0; }
  h2 { font-size: 15pt; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-top: 24px; page-break-after: avoid; }
  h3 { font-size: 12pt; color: #334155; margin-top: 16px; page-break-after: avoid; }
  p { margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 9.5pt; page-break-inside: avoid; }
  th, td { border: 1px solid #cbd5e1; padding: 6px 10px; text-align: left; }
  th { background-color: #f1f5f9; font-weight: 600; color: #0f172a; }
  tr:nth-child(even) { background-color: #f8fafc; }
  code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; font-size: 9pt; color: #4338ca; }
  pre { background: #0f172a; color: #f8fafc; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 8pt; line-height: 1.4; overflow-x: auto; page-break-inside: avoid; }
  blockquote { border-left: 4px solid #6366f1; padding-left: 12px; margin: 12px 0; color: #475569; font-style: italic; background: #f8fafc; padding: 8px 12px; }
  .badge { display: inline-block; padding: 2px 6px; background: #e0e7ff; color: #3730a3; border-radius: 4px; font-weight: 600; font-size: 8pt; }
  hr { border: none; border-top: 1px solid #e2e8f0; margin: 20px 0; }
</style>
</head>
<body>
<h1>Test Document</h1>
<p>Testing PDF generation via Headless Chrome.</p>
</body>
</html>
